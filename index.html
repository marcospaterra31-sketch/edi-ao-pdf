<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VMP VEICULOS MASTER</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{--bg:#ecedea;--panel:#fff;--ink:#1d2024;--mut:#5d636b;--line:#d3d6d1;--acc:#f2c200;--accink:#1d2024;--err:#b3261e;--bar:#1d2024;--barink:#f4f4f1;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171a;--panel:#22262b;--ink:#eceee9;--mut:#9aa1a9;--line:#383d44;--bar:#0e0f11;--err:#ff8a80}}
:root[data-theme="dark"]{--bg:#15171a;--panel:#22262b;--ink:#eceee9;--mut:#9aa1a9;--line:#383d44;--bar:#0e0f11;--err:#ff8a80}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 Barlow,system-ui,Arial,sans-serif;display:flex;flex-direction:column}
header{background:var(--bar);color:var(--barink);display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:10px 16px;border-bottom:4px solid var(--acc)}
.brand{font:700 22px 'Barlow Condensed',Arial Narrow,sans-serif;letter-spacing:.5px;margin-right:auto}
.brand small{display:block;font:500 12px Barlow,sans-serif;opacity:.7;letter-spacing:0}
button,select,input{font:inherit}
.btn{background:transparent;color:inherit;border:1px solid currentColor;border-radius:6px;padding:6px 12px;cursor:pointer;opacity:.95}
.btn:hover{background:rgba(255,255,255,.12)}
.btn.pri{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:600}
.btn[disabled]{opacity:.4;cursor:default}
.seg{display:inline-flex;border:1px solid currentColor;border-radius:6px;overflow:hidden}
.seg button{background:transparent;color:inherit;border:0;padding:6px 12px;cursor:pointer}
.seg button.on{background:var(--acc);color:var(--accink);font-weight:600}
#tools{display:none;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
#tools label{color:var(--mut);font-size:13px}
#tools select,#tools input{padding:4px 6px;border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--ink)}
#tools input{width:60px}
#info{margin-left:auto;color:var(--mut);font-size:13px}
#msg{display:none;padding:9px 16px;background:var(--panel);border-bottom:1px solid var(--line);color:var(--err);font-weight:500}
main{flex:1;overflow:auto;padding:18px 10px 40px}
#drop{max-width:560px;margin:8vh auto 0;border:2px dashed var(--line);border-radius:10px;padding:40px 24px;text-align:center;background:var(--panel)}
#drop h2{font:700 26px 'Barlow Condensed',sans-serif;margin:0 0 8px}
#drop p{color:var(--mut);margin:0 0 18px}
#pages{display:flex;flex-direction:column;align-items:center;gap:16px}
.page{position:relative;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.25);max-width:none}
.page canvas{display:block}
.ov,.hit{position:absolute;box-sizing:border-box}
.ov{overflow:hidden;white-space:pre;line-height:1.25;padding:0}
.hit{cursor:text}
.edit .hit:hover{outline:2px solid var(--acc);background:rgba(242,194,0,.18)}
.edit .ov{cursor:text;outline:1px dashed rgba(242,194,0,.9)}
.view .ov{display:none}.view .hit{display:none}
.newmode .page{cursor:crosshair}
.ed{position:absolute;z-index:5;border:2px solid var(--acc);background:#fff;color:#000;padding:0;margin:0;outline:none;box-sizing:content-box}
.page.ph{background:var(--panel)}
</style>
</head>
<body>
<header>
  <div class="brand">VMP VEICULOS MASTER<small>Leitor e editor de PDF</small></div>
  <button class="btn" id="open">Abrir PDF</button>
  <div class="seg" id="mode"><button data-m="view" class="on">Original</button><button data-m="edit">Editar</button></div>
  <div class="seg"><button id="zo" title="Reduzir">−</button><button id="zi" title="Ampliar">+</button></div>
  <button class="btn pri" id="save" disabled>Salvar PDF editado</button>
  <input type="file" id="file" accept="application/pdf,.pdf" hidden>
</header>
<div id="tools">
  <div class="seg" id="tool"><button data-t="edit" class="on">Editar texto existente</button><button data-t="new">Adicionar texto</button></div>
  <label>Fonte (novo texto) <select id="nf"><option value="H00">Helvetica</option><option value="H10">Helvetica negrito</option><option value="T00">Times</option><option value="T10">Times negrito</option><option value="C00">Courier</option></select></label>
  <label>Tamanho <input id="ns" type="number" value="12" min="4" max="96"></label>
  <button class="btn" id="undo" style="color:var(--ink)" disabled>Desfazer</button>
  <span id="info">Clique em um texto para editar. Fonte, tamanho e cor originais são mantidos. Texto vazio apaga.</span>
</div>
<div id="msg"></div>
<main>
  <div id="drop"><h2>Abra um PDF para começar</h2><p>CRLV, contratos, documentos bancários e outros. Arraste o arquivo para cá ou escolha no computador.</p><button class="btn pri" id="open2">Escolher PDF</button></div>
  <div id="pages" class="view"></div>
</main>
<script src="lib/pdf.min.js"></script>
<script src="lib/pdf-lib.min.js"></script>
<script src="lib/fontkit.umd.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const pdfjs=window.pdfjsLib;
pdfjs.GlobalWorkerOptions.workerSrc='lib/pdf.worker.min.js';
const S={bytes:null,pdf:null,scale:1.4,mode:'view',tool:'edit',edits:[],name:'documento.pdf',ents:[],uid:0,fd:{}};
const FAM={H:'Helvetica,Arial,sans-serif',T:'"Times New Roman",Times,serif',C:'"Courier New",Courier,monospace'};
const showMsg=t=>{const m=$('#msg');m.textContent=t||'';m.style.display=t?'block':'none'};
const pdfName=k=>{const f=k[0],b=k[1]==='1',i=k[2]==='1';
  if(f==='T')return 'TimesRoman'+(b?'Bold':'')+(i?'Italic':'');
  return (f==='C'?'Courier':'Helvetica')+(b?'Bold':'')+(i?(f==='C'||f==='H'?'Oblique':'Italic'):'')};
const label=k=>({H:'Helvetica',T:'Times',C:'Courier'})[k[0]]+(k[1]==='1'?' negrito':'')+(k[2]==='1'?' itálico':'');

function fontKey(page,item,styles){
  let nm='',fo={};try{if(page.commonObjs.has(item.fontName)){fo=page.commonObjs.get(item.fontName);nm=fo.name||''}}catch(e){}
  const fam=(styles[item.fontName]||{}).fontFamily||'';
  const b=(fo.bold||/bold|black|heavy|semibold|demi/i.test(nm))?1:0,i=(fo.italic||/italic|oblique/i.test(nm))?1:0;
  let f='H';
  if(/courier|mono|consol/i.test(nm)||fam==='monospace')f='C';
  else if((/times|serif|georgia|garamond|minion|roman/i.test(nm)&&!/sans/i.test(nm))||fam==='serif')f='T';
  return f+b+i;
}
function sample(cv,dpr,l,t,w,h){
  const c=cv.getContext('2d',{willReadFrequently:true});
  const X=Math.max(0,Math.floor(l*dpr)),Y=Math.max(0,Math.floor(t*dpr));
  const W=Math.max(1,Math.min(cv.width-X,Math.ceil(w*dpr))),H=Math.max(1,Math.min(cv.height-Y,Math.ceil(h*dpr)));
  const px=(x,y)=>Array.from(c.getImageData(Math.min(cv.width-1,Math.max(0,x)),Math.min(cv.height-1,Math.max(0,y)),1,1).data).slice(0,3);
  const a=px(X-3,Y+(H>>1)),b=px(X+W+3,Y+(H>>1));
  const bg=(a[0]+a[1]+a[2])>=(b[0]+b[1]+b[2])?a:b;
  const d=c.getImageData(X,Y,W,H).data;let best=0,fg=[0,0,0];
  for(let i=0;i<d.length;i+=4){const k=Math.abs(d[i]-bg[0])+Math.abs(d[i+1]-bg[1])+Math.abs(d[i+2]-bg[2]);
    if(k>best){best=k;fg=[d[i],d[i+1],d[i+2]]}}
  return{bg,fg};
}

/* ---------- abrir ---------- */
async function openFile(file){
  showMsg('');
  try{
    const buf=new Uint8Array(await file.arrayBuffer());
    const head=new TextDecoder('latin1').decode(buf.slice(0,1024));
    if(!head.includes('%PDF'))throw{name:'NotPdf'};
    S.bytes=buf;S.name=file.name;S.edits=[];S.fd={};
    const task=pdfjs.getDocument({data:buf.slice(),fontExtraProperties:true});
    task.onPassword=(cb,reason)=>{
      const p=prompt(reason===2?'Senha incorreta. Digite novamente:':'Este PDF tem senha. Digite a senha para abrir:');
      if(p===null){task.destroy();showMsg('PDF protegido por senha. Informe a senha para abrir.')}else cb(p)};
    S.pdf=await task.promise;
    $('#drop').style.display='none';
    buildPages();upd();
  }catch(e){
    const n=e&&e.name;
    showMsg(n==='NotPdf'?'Este arquivo não é um PDF válido. Escolha um arquivo com extensão .pdf.':
      n==='PasswordException'?'PDF protegido por senha. Informe a senha para abrir.':
      n==='InvalidPDFException'?'O PDF está danificado ou incompleto. Peça uma nova via do documento ou exporte-o novamente.':
      n==='MissingPDFException'?'Arquivo não encontrado.':
      'Não foi possível abrir este PDF'+(e&&e.message?': '+e.message:'.'));
  }
}

/* ---------- páginas ---------- */
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){io.unobserve(e.target);renderPage(e.target._ent)}}),{rootMargin:'700px'});
async function buildPages(){
  const box=$('#pages');box.innerHTML='';S.ents=[];
  const gen=++S.gen||(S.gen=1);
  for(let n=1;n<=S.pdf.numPages;n++){
    const page=await S.pdf.getPage(n);if(gen!==S.gen)return;
    const vp=page.getViewport({scale:S.scale});
    const el=document.createElement('div');el.className='page ph';el.style.width=vp.width+'px';el.style.height=vp.height+'px';
    const ent={n,page,vp,el,items:[]};el._ent=ent;S.ents.push(ent);
    el.addEventListener('click',ev=>{if(S.mode==='edit'&&S.tool==='new'&&ev.target===el)newText(ent,ev)});
    box.appendChild(el);io.observe(el);
  }
}
async function renderPage(ent){
  const{page,vp,el}=ent,dpr=window.devicePixelRatio||1;
  const cv=document.createElement('canvas');cv.width=vp.width*dpr;cv.height=vp.height*dpr;
  cv.style.width=vp.width+'px';cv.style.height=vp.height+'px';
  await page.render({canvasContext:cv.getContext('2d',{willReadFrequently:true}),viewport:vp,transform:dpr!==1?[dpr,0,0,dpr,0,0]:null}).promise;
  el.classList.remove('ph');el.prepend(cv);ent.cv=cv;ent.dpr=dpr;
  const tc=await page.getTextContent();
  for(const it of tc.items){if(S.fd[it.fontName])continue;let d=null,nm='';try{const fo=page.commonObjs.get(it.fontName);nm=fo.name||'';d=fo.data||null}catch(e){}S.fd[it.fontName]={d,nm}}
  ent.items=tc.items.filter(it=>it.str&&it.str.trim()).map((it,idx)=>{
    const sz=Math.hypot(it.transform[2],it.transform[3])||it.height||10;
    return{idx,str:it.str,x:it.transform[4],y:it.transform[5],w:it.width,size:sz,key:fontKey(page,it,tc.styles),fname:it.fontName,fam:(S.fd[it.fontName]&&S.fd[it.fontName].d)?(tc.styles[it.fontName]||{}).fontFamily:''};
  });
  drawLayer(ent);
}
function pos(ent,x,y){return ent.vp.convertToViewportPoint(x,y)}
function drawLayer(ent){
  if(!ent.cv)return;
  ent.el.querySelectorAll('.ov,.hit,.ed').forEach(n=>n.remove());
  const sc=S.scale;
  for(const e of S.edits.filter(e=>e.page===ent.n)){
    const[vx,vy]=pos(ent,e.x,e.y),fs=e.size*sc,d=document.createElement('div');d.className='ov';
    const w=Math.max(e.w||0,e.str.length*e.size*.5)*sc+2;
    Object.assign(d.style,{left:(vx-1)+'px',top:(vy-fs*1.0)+'px',height:fs*1.25+'px',width:w+'px',fontSize:fs+'px',
      fontFamily:(e.fam?e.fam+',':'')+FAM[e.key[0]],fontWeight:(!e.fam&&e.key[1]==='1')?700:400,fontStyle:(!e.fam&&e.key[2]==='1')?'italic':'normal',
      color:`rgb(${e.fg})`,background:e.bg?`rgb(${e.bg})`:'transparent'});
    d.textContent=e.str;d.onclick=ev=>{ev.stopPropagation();if(S.tool==='edit')openEditor(ent,e)};
    ent.el.appendChild(d);
  }
  for(const it of ent.items){
    if(S.edits.some(e=>e.page===ent.n&&e.src===it.idx))continue;
    const[vx,vy]=pos(ent,it.x,it.y),fs=it.size*sc,d=document.createElement('div');d.className='hit';
    Object.assign(d.style,{left:vx+'px',top:(vy-fs)+'px',width:it.w*sc+'px',height:fs*1.25+'px'});
    d.onclick=ev=>{ev.stopPropagation();if(S.tool==='edit')openEditor(ent,{src:it.idx,page:ent.n,x:it.x,y:it.y,w:it.w,size:it.size,key:it.key,fname:it.fname,fam:it.fam,str:it.str,orig:it.str})};
    ent.el.appendChild(d);
  }
}

/* ---------- edição ---------- */
function openEditor(ent,rec){
  ent.el.querySelectorAll('.ed').forEach(n=>n.remove());
  const sc=S.scale,[vx,vy]=pos(ent,rec.x,rec.y),fs=rec.size*sc;
  if(!rec.fg){const s=sample(ent.cv,ent.dpr,vx,vy-fs,rec.w*sc,fs*1.25);rec.bg=s.bg;rec.fg=s.fg}
  const inp=document.createElement('input');inp.className='ed';inp.value=rec.str;
  Object.assign(inp.style,{left:(vx-2)+'px',top:(vy-fs*1.05)+'px',height:fs*1.25+'px',width:Math.max(rec.w*sc+40,120)+'px',
    fontSize:fs+'px',fontFamily:(rec.fam?rec.fam+',':'')+FAM[rec.key[0]],fontWeight:(!rec.fam&&rec.key[1]==='1')?700:400,fontStyle:(!rec.fam&&rec.key[2]==='1')?'italic':'normal'});
  ent.el.appendChild(inp);inp.focus();inp.select();
  $('#info').textContent='Fonte do original: '+((S.fd[rec.fname]&&S.fd[rec.fname].nm)||label(rec.key))+', '+rec.size.toFixed(1).replace('.',',')+' pt';
  let done=false;
  const end=ok=>{if(done)return;done=true;
    if(ok){const v=inp.value,old=S.edits.find(e=>e.id===rec.id);
      if(old){old.str=v}else if(v!==rec.orig){rec.id=++S.uid;rec.str=v;S.edits.push(rec)}}
    drawLayer(ent);upd()};
  inp.onkeydown=e=>{if(e.key==='Enter')end(true);if(e.key==='Escape')end(false)};
  inp.onblur=()=>end(true);
}
function newText(ent,ev){
  const r=ent.el.getBoundingClientRect(),[x,y]=ent.vp.convertToPdfPoint(ev.clientX-r.left,ev.clientY-r.top);
  const size=+$('#ns').value||12;
  openEditor(ent,{page:ent.n,x,y:y-size*.8,w:80/S.scale,size,key:$('#nf').value,str:'',orig:null,bg:null,fg:[0,0,0],isNew:true});
}
function upd(){
  const n=S.edits.length;$('#save').disabled=!S.pdf||!n;$('#undo').disabled=!n;
  $('#save').textContent=n?`Salvar PDF editado (${n})`:'Salvar PDF editado';
}
$('#undo').onclick=()=>{const e=S.edits.pop();if(e){const en=S.ents.find(x=>x.n===e.page);drawLayer(en);upd()}};

/* ---------- salvar ---------- */
const clean=s=>s.replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/[–—]/g,'-').replace(/[^\x20-\x7E\xA0-\xFF]/g,'?');
async function save(){
  showMsg('');
  try{
    const{PDFDocument,StandardFonts,rgb}=PDFLib;
    const doc=await PDFDocument.load(S.bytes);const fonts={},warn=[];if(window.fontkit)doc.registerFontkit(window.fontkit);
    for(const e of S.edits){
      const pg=doc.getPage(e.page-1);let f=null,s=e.str;const fd=e.fname&&S.fd[e.fname]&&S.fd[e.fname].d;if(fd&&window.fontkit){try{const k=fonts['E'+e.fname]||(fonts['E'+e.fname]={kit:fontkit.create(fd),emb:null});if([...s].every(ch=>k.kit.hasGlyphForCodePoint(ch.codePointAt(0)))){k.emb=k.emb||await doc.embedFont(fd,{subset:false});f=k.emb}else warn.push(s)}catch(err){warn.push(s)}}
      if(!f){const nm=pdfName(e.key);f=fonts[nm]||(fonts[nm]=await doc.embedFont(StandardFonts[nm]));s=clean(s)}
      const c=a=>rgb(a[0]/255,a[1]/255,a[2]/255);
      if(e.bg){const w=Math.max(e.w,s?f.widthOfTextAtSize(s,e.size):0)+1;
        pg.drawRectangle({x:e.x-.5,y:e.y-e.size*.25,width:w,height:e.size*1.25,color:c(e.bg),borderWidth:0})}
      if(s)pg.drawText(s,{x:e.x,y:e.y,size:e.size,font:f,color:c(e.fg)});
    }
    const out=await doc.save();if(warn.length)showMsg('Aviso: '+warn.length+' edição(ões) usam letras que não existem na fonte embutida do PDF; nelas foi usada a fonte padrão mais próxima: '+warn.slice(0,3).map(w=>'"'+w+'"').join(', '));
    const dl=typeof claude!=='undefined'?await claude.use('downloads'):null;
    const fn=S.name.replace(/\.pdf$/i,'')+'_editado.pdf';
    if(dl){await dl.save({filename:fn,data:out})}
    else{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([out],{type:'application/pdf'}));a.download=fn;a.click()}
  }catch(e){
    if(e&&e.code==='declined')return;
    showMsg(/encrypt/i.test(e&&e.message||'')?'Este PDF é protegido e não pode ser editado. Use uma versão sem senha.':'Não foi possível salvar: '+((e&&e.message)||'erro desconhecido'));
  }
}
$('#save').onclick=save;

/* ---------- interface ---------- */
function setMode(m){S.mode=m;
  document.querySelectorAll('#mode button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
  $('#pages').className=m==='edit'?'edit'+(S.tool==='new'?' newmode':''):'view';
  $('#tools').style.display=m==='edit'?'flex':'none'}
document.querySelectorAll('#mode button').forEach(b=>b.onclick=()=>setMode(b.dataset.m));
document.querySelectorAll('#tool button').forEach(b=>b.onclick=()=>{S.tool=b.dataset.t;
  document.querySelectorAll('#tool button').forEach(x=>x.classList.toggle('on',x===b));setMode('edit')});
const zoom=d=>{if(!S.pdf)return;S.scale=Math.min(3,Math.max(.6,S.scale+d));buildPages()};
$('#zi').onclick=()=>zoom(.2);$('#zo').onclick=()=>zoom(-.2);
const pick=()=>$('#file').click();$('#open').onclick=pick;$('#open2').onclick=pick;
$('#file').onchange=e=>{if(e.target.files[0])openFile(e.target.files[0]);e.target.value=''};
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',e=>{e.preventDefault();const f=e.dataTransfer.files[0];if(f)openFile(f)});
</script>
</body>
</html>
